<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="glow" cx="20%" cy="30%" r="60%" fx="20%" fy="30%">
      <stop offset="0%" stop-color="#4361ee" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3a0ca3" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0D0D0F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#4cc9f0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0D0D0F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4361ee"/>
      <stop offset="100%" stop-color="#3a0ca3"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#4895ef"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="#0D0D0F"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Left Content Column -->
  <g transform="translate(80, 100)">
    <!-- Version Tag -->
    <rect width="210" height="34" rx="17" fill="rgba(67, 97, 238, 0.15)" stroke="rgba(67, 97, 238, 0.4)" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#34C759"/>
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#4cc9f0">v0.1.7 · AGPL-3.0 Open Source</text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Taleno</text>

    <!-- Slogan / Subtitle -->
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#4cc9f0">In-Place WYSIWYG Markdown Editor</text>
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.7)">Zero split panes · Render-as-you-type · Built on Tauri 2 + Rust + SolidJS</text>

    <!-- Value Proposition Chips -->
    <g transform="translate(0, 270)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="160" height="42" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">⚡ &lt;400ms Cold Start</text>

      <!-- Chip 2 -->
      <rect x="175" y="0" width="165" height="42" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="193" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">🔒 100% Local-First</text>

      <!-- Chip 3 -->
      <rect x="355" y="0" width="185" height="42" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="373" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">🧩 Plugins &amp; Themes</text>

      <!-- Chip 4 -->
      <rect x="555" y="0" width="140" height="42" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="573" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">🌐 9 Languages</text>
    </g>

    <!-- Platform Availability -->
    <g transform="translate(0, 360)">
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.5)">Available for Windows (x64 / MSI) · macOS (Apple Silicon / Intel) · Linux (AppImage / DEB / RPM)</text>
    </g>
  </g>

  <!-- Right Graphic: Stylized App Icon Mockup -->
  <g transform="translate(850, 160)" filter="url(#cardShadow)">
    <rect width="260" height="260" rx="58" fill="url(#iconBg)"/>
    <rect x="61" y="49" width="138" height="162" rx="12" fill="#ffffff" opacity="0.95"/>
    <rect x="81" y="81" width="61" height="13" rx="3" fill="url(#iconBg)"/>
    <rect x="81" y="107" width="98" height="8" rx="2" fill="#6c757d" opacity="0.6"/>
    <rect x="81" y="122" width="81" height="8" rx="2" fill="#6c757d" opacity="0.6"/>
    <rect x="81" y="137" width="92" height="8" rx="2" fill="#6c757d" opacity="0.6"/>
    <polygon points="157,193 198,152 213,167 173,208 152,213" fill="url(#accentGrad)"/>
    <polygon points="152,213 165,210 160,205" fill="#f72585"/>
  </g>
</svg>