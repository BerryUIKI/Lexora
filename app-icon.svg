<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4361ee"/>
      <stop offset="100%" stop-color="#3a0ca3"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="100%" stop-color="#4895ef"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Document / Page Shape -->
  <rect x="120" y="96" width="272" height="320" rx="20" fill="#ffffff" opacity="0.95"/>
  
  <!-- Stylized Markdown "M" Header Lines -->
  <rect x="160" y="160" width="120" height="24" rx="6" fill="url(#bgGrad)"/>
  <rect x="160" y="210" width="192" height="14" rx="4" fill="#6c757d" opacity="0.6"/>
  <rect x="160" y="240" width="160" height="14" rx="4" fill="#6c757d" opacity="0.6"/>
  <rect x="160" y="270" width="180" height="14" rx="4" fill="#6c757d" opacity="0.6"/>
  
  <!-- Stylized Pen / Quill accent -->
  <polygon points="310,380 390,300 420,330 340,410 300,420" fill="url(#accentGrad)"/>
  <polygon points="300,420 325,415 315,405" fill="#f72585"/>
