name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.1.3)'
        required: true
        default: 'v0.1.3'
      release_name:
        description: 'Release title'
        required: false
        default: 'Lexora v0.1.3'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            asset_name: 'Lexora_macOS_aarch64[ext]'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            asset_name: 'Lexora_macOS_x86_64[ext]'
          - platform: 'ubuntu-22.04'
            args: ''
            asset_name: 'Lexora_Linux_x86_64[ext]'
          - platform: 'windows-latest'
            args: ''
            asset_name: 'Lexora_Windows_x86_64[ext]'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri Package & Create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          releaseName: ${{ github.event_name == 'workflow_dispatch' && inputs.release_name || format('Lexora {0}', github.ref_name) }}
          releaseBody: |
            # Lexora Release

            **A seamless, high-performance Markdown reader & in-place WYSIWYG editor built with Tauri 2 + Rust + SolidJS.**

            ### ✨ Highlights in v0.1.3
            - **Native macOS Window Chrome**: macOS now retains native traffic-light controls and overlay title-bar behavior, while Windows and Linux keep Lexora's compact custom controls.
            - **Improved Markdown Table Contrast**: Removed table header, row, and column fills across Reading mode, Writing mode, and exported HTML.
            - **Stable Release Asset Names**: Installers now use `Lexora_<OS>_<architecture>` names without embedded version numbers.
            - **Simplified Instant Downloads**: All nine localized READMEs now provide concise, stable links to the latest platform packages.

            See [CHANGELOG.md](https://github.com/BerryUIKI/Lexora/blob/main/CHANGELOG.md) for full release details.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          assetNamePattern: ${{ matrix.asset_name }}
