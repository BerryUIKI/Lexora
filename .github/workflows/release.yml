name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'
      release_name:
        description: 'Release title'
        required: false
        default: 'Lexora v0.1.0'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || inputs.tag_name || 'v0.1.2' }}
          releaseName: ${{ inputs.release_name || format('Lexora {0}', github.ref_name) }}
          releaseBody: |
            # Lexora Release

            **A Typora-style, high-performance Markdown reader & in-place editor built with Tauri 2 + Rust + SolidJS.**

            ### ✨ Highlights in this Release:
            - **9-Language Internationalization (i18n)**: Native localization support for English, 简体中文, 繁體中文, 日本語, 한국어, Deutsch, Français, Español, and Русский with automatic system language detection and instant live switching.
            - **Top MenuBar Language Switcher**: Added dedicated `Help -> Language (语言)` submenu with native language names and `Auto (Follow System)` option.
            - **Open-Source License Migration**: Migrated repository license to **GNU Affero General Public License v3.0 (AGPL-3.0)**.
            - **VS Code-Style Custom Title & Menu Bar**: Frameless window with custom draggable titlebar, min/max/close controls, and `File`, `Edit`, `View`, `Window`, `Help` menus.
            - **Windows `.md` Shell File Associations**: Auto-registers `.md`, `.markdown`, `.mdx`, and `.txt` file types; opens documents directly on double-click in Windows Explorer.
            - **Tri-State Display Modes**: Instantly toggle between **Reading Mode** (read-only rendered HTML), **Writing Mode** (Typora-style in-place WYSIWYG), and **Code Mode** (source code with synchronized line numbers).
            - **Monochrome Vector UI**: Pure theme-adaptive vector iconography (`stroke="currentColor"`) across status bar, toolbar, tabs, and outline sidebar.
            - **In-Place Formatting & Paragraph Format**: Format selected text directly (<kbd>Ctrl+B</kbd> for bold, <kbd>Ctrl+0</kbd> for paragraph, <kbd>Ctrl+1~6</kbd> for headings, etc.).
            - **Outline-First Sidebar**: Layered Table of Contents sidebar with smooth anchor scrolling across all display modes.
            - **Intelligent Drag & Drop**: Drop files into window to open, drop onto tab bar for new tabs, or drop into text area to insert Markdown links.
            - **Crash-Safe Atomic Saving**: Never lose work with atomic writes (`.tmp` -> atomic rename).
            - **Global Workspace Search & Utilities**: Full-text ripgrep-grade search (<kbd>Ctrl+Shift+F</kbd>), in-document Find & Replace (<kbd>Ctrl+F</kbd>/<kbd>Ctrl+H</kbd>), standalone HTML export (<kbd>Ctrl+E</kbd>), Mermaid diagrams, and KaTeX math.

            See [CHANGELOG.md](https://github.com/BerryUIKI/Lexora/blob/main/CHANGELOG.md) for full release details.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Apple Silicon Aliased Assets (macOS aarch64 only)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name || inputs.tag_name || 'v0.1.1' }}"
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -n 1)
          if [ -f "$DMG" ]; then
            AS_NAME="$(basename "$DMG" | sed 's/aarch64/Apple-Silicon/g')"
            cp "$DMG" "$AS_NAME"
            gh release upload "$TAG" "$AS_NAME" --clobber || true
          fi
